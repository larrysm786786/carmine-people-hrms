<mat-sidenav-container class="shell">
  <mat-sidenav
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="isMobile() ? sidenavOpened() : true"
    (closedStart)="sidenavOpened.set(false)"
    class="sidenav"
  >
    <div class="brand">
      @if (brandingService.branding().logoUrl) {
        <img class="brand-logo" [src]="brandingService.branding().logoUrl" alt="" />
      } @else {
        <mat-icon>badge</mat-icon>
      }
      <span>{{ brandingService.branding().appName }}</span>
    </div>
    <mat-nav-list>
      @for (item of navItems; track item.route) {
        <a
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.route === '/' }"
          (click)="isMobile() && sidenavOpened.set(false)"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="topbar">
      @if (isMobile()) {
        <button mat-icon-button (click)="toggleSidenav()" aria-label="Toggle menu">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="spacer"></span>
      <button mat-button [matMenuTriggerFor]="userMenu">
        <mat-icon>account_circle</mat-icon>
        @if (!isMobile()) {
          {{ authService.profile()?.firstName }} {{ authService.profile()?.lastName }}
        }
      </button>
      <mat-menu #userMenu="matMenu">
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Sign out</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
