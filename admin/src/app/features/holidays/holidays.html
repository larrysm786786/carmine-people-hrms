<h1>Holidays</h1>

<mat-card class="filters-card">
  <div class="add-row">
    <mat-form-field appearance="outline"><mat-label>Name</mat-label><input matInput [(ngModel)]="newName" /></mat-form-field>
    <mat-form-field appearance="outline"><mat-label>Description</mat-label><input matInput [(ngModel)]="newDescription" /></mat-form-field>
    <mat-form-field appearance="outline"><mat-label>Date</mat-label><input matInput type="date" [(ngModel)]="newDate" /></mat-form-field>
    <mat-checkbox [(ngModel)]="newIsOptional">Optional</mat-checkbox>
    <button mat-flat-button color="primary" (click)="add()">Add</button>
  </div>
</mat-card>

<div class="table-scroll">
<table mat-table [dataSource]="holidays()">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let h">{{ h.name }}</td>
  </ng-container>

  <ng-container matColumnDef="date">
    <th mat-header-cell *matHeaderCellDef>Date</th>
    <td mat-cell *matCellDef="let h">{{ h.date }}</td>
  </ng-container>

  <ng-container matColumnDef="isOptional">
    <th mat-header-cell *matHeaderCellDef>Optional</th>
    <td mat-cell *matCellDef="let h">{{ h.isOptional ? 'Yes' : 'No' }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let h">
      <button mat-icon-button color="warn" (click)="remove(h.id)"><mat-icon>delete</mat-icon></button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
</div>

@if (!isLoading() && holidays().length === 0) {
  <p class="empty">No holidays added yet. Add the first one above.</p>
}
