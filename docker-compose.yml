services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "CarminePeopleDb"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=CarminePeopleDb;Username=postgres;Password=${POSTGRES_PASSWORD}"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env, at least 32 chars}"
      Jwt__Issuer: "${JWT_ISSUER:-CarminePeople}"
      Jwt__Audience: "${JWT_AUDIENCE:-CarminePeopleClients}"
      Jwt__AccessTokenMinutes: "${JWT_ACCESS_TOKEN_MINUTES:-15}"
      Cors__AllowedOrigins__0: "${CORS_ALLOWED_ORIGIN_0:-http://localhost:4200}"
      DocumentStorage__RootPath: "${STORAGE_ROOT_PATH:-App_Data/documents}"
      Fcm__ServiceAccountJson: "${FCM_SERVICE_ACCOUNT_JSON:-}"
      Ai__Groq__ApiKey: "${AI_GROQ_API_KEY:-}"
      Ai__Groq__Model: "${AI_GROQ_MODEL:-openai/gpt-oss-120b}"
      Ai__Groq__MaxTokens: "${AI_GROQ_MAX_TOKENS:-1024}"
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres-data:
